identity:
  name: read_file_content
  author: NanoFile Team
  label:
    en_US: Read File Content
    zh_Hans: 读取文件内容
description:
  human:
    en_US: "Safely read the UTF-8 text content of a local file."
    zh_Hans: "安全读取本地文件的 UTF-8 文本内容。"
  llm: "Read the textual content of a local file safely, with an optional character limit."
parameters:
  - name: path
    type: string
    required: true
    form: llm
    label:
      en_US: File Path
      zh_Hans: 文件路径
    human_description:
      en_US: "Absolute path to the file."
      zh_Hans: "文件的绝对路径。"
    llm_description: "The absolute file path to read from."
  - name: max_characters
    type: number
    required: false
    form: llm
    default: 50000
    label:
      en_US: Max Characters
      zh_Hans: 最大读取字符数
    human_description:
      en_US: "Maximum number of characters to read. Defaults to 50000."
      zh_Hans: "最大读取字符数，默认 50000。"
    llm_description: "Maximum number of characters to read. Defaults to 50000."
