identity:
  name: create_folder
  author: NanoFile Team
  label:
    en_US: Create Folder
    zh_Hans: 新建目录
description:
  human:
    en_US: "Create a directory recursively, including any missing parent directories."
    zh_Hans: "递归创建目录，自动补全缺失的父级目录。"
  llm: "Create a directory recursively at the given path, creating any missing parent directories along the way."
parameters:
  - name: path
    type: string
    required: true
    form: llm
    label:
      en_US: Directory Path
      zh_Hans: 目录路径
    human_description:
      en_US: "Absolute path of the directory to create."
      zh_Hans: "要创建的目录的绝对路径。"
    llm_description: "The absolute directory path to create."
