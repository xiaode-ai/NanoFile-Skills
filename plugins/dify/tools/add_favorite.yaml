identity:
  name: add_favorite
  author: NanoFile Team
  label:
    en_US: Add Favorite
    zh_Hans: 添加收藏
description:
  human:
    en_US: "Add a folder path to favorites and quick access, with an optional alias."
    zh_Hans: "将目录路径添加到收藏夹与快速访问，可设置可选别名。"
  llm: "Add a folder path to favorites and quick access, optionally with a custom display alias."
parameters:
  - name: path
    type: string
    required: true
    form: llm
    label:
      en_US: Folder Path
      zh_Hans: 目录路径
    human_description:
      en_US: "Absolute path of the folder to bookmark."
      zh_Hans: "要收藏的目录绝对路径。"
    llm_description: "The absolute folder path to add to favorites."
  - name: alias
    type: string
    required: false
    form: llm
    label:
      en_US: Alias
      zh_Hans: 别名
    human_description:
      en_US: "Optional custom display name for the favorite entry."
      zh_Hans: "可选，收藏项的自定义显示名称。"
    llm_description: "Optional custom display name for the favorite entry."
