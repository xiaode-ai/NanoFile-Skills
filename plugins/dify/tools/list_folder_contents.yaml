identity:
  name: list_folder_contents
  author: NanoFile Team
  label:
    en_US: List Folder Contents
    zh_Hans: 列出目录内容
description:
  human:
    en_US: "List the direct contents of a folder, including size and type for each entry."
    zh_Hans: "列出目录的直接子项，包含每个条目的大小与类型。"
  llm: "List the direct children of a directory together with their size and type. This is not recursive."
parameters:
  - name: path
    type: string
    required: true
    form: llm
    label:
      en_US: Directory Path
      zh_Hans: 目录路径
    human_description:
      en_US: "Absolute path to the directory."
      zh_Hans: "目录的绝对路径。"
    llm_description: "The absolute directory path to list."
  - name: include_hidden
    type: boolean
    required: false
    form: llm
    default: false
    label:
      en_US: Include Hidden
      zh_Hans: 包含隐藏项
    human_description:
      en_US: "Whether to include hidden items. Defaults to false."
      zh_Hans: "是否包含隐藏项目，默认不包含。"
    llm_description: "Set to true to include hidden items. Defaults to false."
